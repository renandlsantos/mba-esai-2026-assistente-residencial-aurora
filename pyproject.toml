[project]
name = "assistente-residencial-aurora"
version = "0.1.0"
description = "Assistente residencial com Google ADK e consentimento persistente"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-adk==2.9.2",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "python-dotenv==1.2.2",
  "aiosqlite==0.22.1",
  "sqlalchemy==2.0.54",
  "greenlet==3.5.6",
  "httpx==0.28.1",
]

[project.scripts]
aurora = "aurora.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
